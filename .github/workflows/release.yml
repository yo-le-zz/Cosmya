name: Release

on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --release

      - name: Set up Python test environment
        run: |
          uv venv --python 3.12 .venv
          . .venv/bin/activate
          uv pip install -e . --group dev

      - name: Run Python tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/python/ -q

      - name: Build the Debian package
        run: ./build.sh

      - name: Verify the built package
        run: |
          set -euo pipefail
          DEB_FILE="$(ls dist/cosmya_*_amd64.deb)"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE" | grep -q "usr/bin/cosmya"

      - name: Generate checksum
        run: |
          cd dist
          DEB_FILE="$(ls cosmya_*_amd64.deb)"
          sha256sum "$DEB_FILE" > "${DEB_FILE}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cosmya_*_amd64.deb
            dist/cosmya_*_amd64.deb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
