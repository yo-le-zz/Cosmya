[project]
name = "cosmya"
version = "0.1.0"
description = "AI-powered, read-only code auditor with a Rust-backed sandboxed inspection engine."
readme = "README.md"
license = { text = "YO-LE-ZZ COMMUNITY LICENSE v1.0" }
authors = [{ name = "yolezz" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.urls]
Repository = "https://github.com/yo-le-zz/Cosmya"
Website = "https://cosmya.pages.dev/"

[project.scripts]
cosmya = "cosmya.__main__:main"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Compiles rust/ and installs the resulting extension at cosmya/_native
# so Python can `import cosmya._native` (see agent/tools.py).
manifest-path = "rust/Cargo.toml"
module-name = "cosmya._native"
python-source = "src"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
